[package]
authors = ["Brian Caswell <bcaswell@gmail.com>"]
categories = ["api-bindings"]
description = "Unofficial suite of helpers to expand on the use of azure-identity"
documentation = "https://docs.rs/azure-identity-helpers"
edition = "2024"
homepage = "https://github.com/demoray/azure-identity-helpers"
keywords = ["azure"]
license = "MIT"
name = "azure-identity-helpers"
repository = "https://github.com/demoray/azure-identity-helpers"
rust-version = "1.91"
version = "0.2.0"

[dependencies]
async-lock = { version = "3.4", default-features = false }
async-trait = { version = "0.1", default-features = false }
azure_core = { version = "1.1", default-features = false }
azure_identity = { version = "1.0", default-features = false }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
time = { version = "0.3", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false }
url = { version = "2.5", default-features = false }

[dev-dependencies]
azure_core = { version = "1.1", default-features = false, features = ["reqwest_rustls", "tokio"] }
tokio = { version = "1.53", default-features = false, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }

[lints.clippy]
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

allow_attributes = "deny"
allow_attributes_without_reason = "deny"
absolute_paths = "deny"
dbg_macro = "deny"
let_underscore_must_use = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
error_impl_error = "deny"
exit = "deny"
float_cmp_const = "deny"
format_push_string = "deny"
get_unwrap = "deny"
iter_over_hash_type = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
mixed_read_write_in_expression = "deny"
modulo_arithmetic = "deny"
multiple_unsafe_ops_per_block = "deny"
mutex_atomic = "deny"
needless_raw_strings = "deny"
panic = "deny"
partial_pub_fields = "deny"
pathbuf_init_then_push = "deny"
print_stderr = "deny"
print_stdout = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
ref_patterns = "deny"
same_name_method = "deny"
str_to_string = "deny"
string_add = "deny"
string_add_assign = "deny"
tests_outside_test_module = "deny"
todo = "deny"
try_err = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unseparated_literal_suffix = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
verbose_file_reads = "deny"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
significant_drop_tightening = "allow"
multiple_crate_versions = "allow"

[lints.rust]
trivial_casts = "deny"
ambiguous_negative_literals = "deny"
non_snake_case = "deny"
non_upper_case_globals = "deny"
redundant_imports = "deny"
redundant_lifetimes = "deny"
trivial_numeric_casts = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_imports = "deny"
unused_lifetimes = "deny"
